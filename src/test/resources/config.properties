# Configuración por defecto. Cualquier clave se puede sobrescribir con -D<clave>=<valor>
# Ejemplo: mvn clean test -Dbrowser=edge -Dheadless=true

base.url=https://automationexercise.com
api.url=https://automationexercise.com/api

# chrome | edge
browser=chrome
headless=false

# Tiempo máximo (segundos) de las esperas explícitas
explicit.wait.seconds=15
page.load.timeout.seconds=60

# Bloquea dominios de publicidad (Google Ads) que interrumpen la navegación del sitio
block.ads=true
